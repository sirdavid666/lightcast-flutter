name: Build LightCast Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-director:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Get shared dependencies
        working-directory: packages/lightcast_shared
        run: flutter pub get

      - name: Get Director dependencies
        working-directory: apps/lightcast_director
        run: flutter pub get

      - name: Clean old outputs
        working-directory: apps/lightcast_director
        run: flutter clean

      - name: Build Director APK
        working-directory: apps/lightcast_director
        run: flutter build apk --debug --no-pub

      - name: Upload Director APK
        uses: actions/upload-artifact@v4
        with:
          name: LightCast-Director.apk
          path: apps/lightcast_director/build/app/outputs/flutter-apk/app-debug.apk

  build-camera:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Get Camera dependencies
        working-directory: apps/lightcast_camera
        run: flutter pub get

      - name: Clean old outputs
        working-directory: apps/lightcast_camera
        run: flutter clean

      - name: Build Camera APK
        working-directory: apps/lightcast_camera
        run: flutter build apk --debug --no-pub

      - name: Upload Camera APK
        uses: actions/upload-artifact@v4
        with:
          name: LightCast-Camera.apk
          path: apps/lightcast_camera/build/app/outputs/flutter-apk/app-debug.apk
